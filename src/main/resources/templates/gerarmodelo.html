<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Geração de Imagem com IA</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fffff0;
            width: 600px; /* Aumentar a largura para acomodar os toggles ao lado do prompt */
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            text-align: center;
        }

        .container::before,
        .container::after {
            content: '';
            position: absolute;
            background-color: #e74c3c;
            border-radius: 50%;
            width: 160px;
            height: 160px;
            z-index: -1;
        }

        .container::before { top: -40px; left: -40px; }
        .container::after { bottom: -40px; right: -40px; }

        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #e74c3c;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c0392b;
        }

        .image-container {
            margin-top: 20px;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .toggle-group {
            display: flex;
            flex-direction: column;
            margin: 10px 0;
            background-color: #f2e8d5; /* Fundo suavemente bege escuro */
            padding: 10px; /* Espaçamento interno */
            border-radius: 5px;
        }

        .toggle {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .toggle input {
            display: none; /* Esconder o input real */
        }

        .toggle-label {
            cursor: pointer;
            padding: 10px;
            background-color: #e7e7e7;
            border-radius: 5px;
            transition: background-color 0.3s;
            margin-right: 10px;
        }

        .toggle input:checked + .toggle-label {
            background-color: #e74c3c;
            color: white;
        }

        .prompt-container {
            display: flex;
            align-items: flex-start; /* Alinha ao topo */
            justify-content: space-between; /* Espaço entre os elementos */
        }

        .prompt-input {
            flex-grow: 1; /* Ocupa o espaço restante */
            margin-right: 20px; /* Espaço entre o prompt e os toggles */
        }

        /* Alinhamento horizontal para os toggles */
        .toggle-group.horizontal {
            flex-direction: row;
            justify-content: space-around; /* Espaçamento entre os toggles */
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="header">Gerar Imagem com IA</h1>

    <form action="/stylishpro/modelos/gerarmodelo" method="post">
        <div class="prompt-container">
            <div class="prompt-input">
                <label for="prompt">Digite o prompt para a imagem:</label>
                <input type="text" id="prompt" name="prompt" placeholder="Quero um modelo de roupa..." required>
            </div>
        </div>

     
        <button type="submit">Gerar Imagem</button>
    </form>

    <div class="image-container" th:if="${imageUrl}">
        <h2>Prompt: <span th:text="${prompt}"></span></h2>
        <img th:src="${imageUrl}" alt="Imagem gerada">
    </div>
</div>

</body>
</html>
