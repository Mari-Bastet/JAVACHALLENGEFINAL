<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
    <style>
        /* Estilos principais */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container de login */
        .container {
            background-color: #fffff0;
            width: 320px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .container::before,
        .container::after {
            content: '';
            position: absolute;
            background-color: #e74c3c;
            border-radius: 50%;
            width: 160px;
            height: 160px;
            z-index: -1;
        }

        .container::before { top: -40px; left: -40px; }
        .container::after { bottom: -40px; right: -40px; }

        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        /* Estilos dos campos de entrada e botão */
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #e74c3c;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c0392b;
        }

        /* Estilos do rodapé */
        footer {
            text-align: center;
            margin-top: 15px;
        }

        footer a {
            color: #e74c3c;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Estilo da mensagem de erro */
        .redText {
            color: #ff0000;
            font-weight: bold;
            text-align: center;
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }

        /* Centraliza o texto dentro do container pai */
        .dialog-row {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
    </style>
</head>
<body>

<section class="container">
    <h1 class="header">Login</h1>

    <form action="/stylishpro/clientes/login" method="post">
        <div class="dialog-row">
            <label th:if="${param.error}" th:text="${session['SPRING_SECURITY_LAST_EXCEPTION'].message}" class="redText"></label>                   
        </div>

        <p>
            <label for="username">Usuário:</label>
            <input name="username" id="username" type="text" required>
        </p>

        <p>
            <label for="senha">Senha:</label>
            <input name="password" type="password" id="senha" required>
        </p>

        <p>
            <button type="submit">Entrar</button>
        </p>

        <div class="register">
            <p>Não possui conta? <a href="/stylishpro/clientes/adicionar">Cadastre-se!</a></p>
        </div>
    </form>
</section>

</body>
</html>
