<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fffff0;
            width: 320px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .container::before,
        .container::after {
            content: '';
            position: absolute;
            background-color: #e74c3c;
            border-radius: 50%;
            width: 160px;
            height: 160px;
            z-index: -1;
        }

        .container::before { top: -40px; left: -40px; }
        .container::after { bottom: -40px; right: -40px; }

        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #e74c3c;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c0392b;
        }

        footer {
            text-align: center;
            margin-top: 15px;
        }

        footer a {
            color: #e74c3c;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .hamburger {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 3px;
            background-color: #333;
            border-radius: 3px;
        }

        .hamburger::before, .hamburger::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #333;
            border-radius: 3px;
        }

        .hamburger::before { top: -10px; }
        .hamburger::after { bottom: -10px; }
    </style>

</head>
<body>
    <div class="container">
        <div class="header">Login</div>
        <p>Entre na sua conta usando e-mail e senha</p>
        <form th:action="@{/clientes/login/realizarLogin}" method="post">
            <input type="email" id="email" name="email" placeholder="Email" required />
            <input type="password" id="senha" name="senha" placeholder="Senha" required />
            <button type="submit">Login</button>
        </form>
        <footer>
            <a href="/cadastrar">Não tem conta? Cadastrar</a>
        </footer>
    </div>
</body>
</html>
